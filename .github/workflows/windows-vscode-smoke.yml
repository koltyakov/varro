name: Windows VS Code Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vscode-smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm

      - name: Use pinned npm
        shell: bash
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Install VS Code
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vscode.zip'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'vscode'
          Invoke-WebRequest 'https://update.code.visualstudio.com/1.120.0/win32-x64-archive/stable' -OutFile $archive
          Expand-Archive $archive -DestinationPath $installDirectory

      - name: Run Windows VS Code sandbox smoke tests
        id: sandbox
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          VARRO_KEEP_VSCODE_SANDBOX: 1
          VARRO_VSCODE_EXECUTABLE: ${{ runner.temp }}\vscode\Code.exe
        run: npm run test:vscode-sandbox -- clean-install-missing-cli invalid-cli-path healthy-first-run

      - name: Upload failed sandbox profiles
        if: failure() && steps.sandbox.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-vscode-sandbox-${{ github.run_id }}
          path: ${{ runner.temp }}/vr-*
          if-no-files-found: ignore

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24.21.0]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Restore test results
        uses: actions/cache@v6
        with:
          path: tmp/test-cache
          key: test-results-v1-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'scripts/test-cache.mjs', 'scripts/run-cached-tests.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-results-v1-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'scripts/test-cache.mjs', 'scripts/run-cached-tests.mjs') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Check TypeScript suggestions
        run: npm run typecheck:suggestions

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run fmt:check

      - name: Test
        run: npm run test:coverage:cached

      - name: Test build scripts
        run: npm run test:scripts:cached

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package:vsix

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24.21.0]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use pinned npm
        shell: bash
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Restore test results
        uses: actions/cache@v6
        with:
          path: tmp/test-cache
          key: test-results-v1-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'scripts/test-cache.mjs', 'scripts/run-cached-tests.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-results-v1-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'scripts/test-cache.mjs', 'scripts/run-cached-tests.mjs') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Check TypeScript suggestions
        run: npm run typecheck:suggestions

      - name: Test
        run: npm run test:affected

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package:vsix

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep this version aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust container checkout
        # The mounted checkout belongs to the host runner, not the container user.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Restore browser script test results
        uses: actions/cache@v6
        with:
          path: tmp/test-cache
          key: browser-test-results-v1-${{ runner.os }}-node-24.21.0-shard-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'scripts/test-cache.mjs', 'scripts/run-cached-tests.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            browser-test-results-v1-${{ runner.os }}-node-24.21.0-shard-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'scripts/test-cache.mjs', 'scripts/run-cached-tests.mjs') }}-

      - name: Test browser scripts
        run: npm run test:scripts:browser:cached

      - name: Run e2e tests
        # Bypass pretest:e2e; the matching container already includes the browsers.
        run: node scripts/run-e2e.mjs --shard=${{ matrix.shard }}/2

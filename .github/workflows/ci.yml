name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.18.1]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check TypeScript suggestions
        run: npm run typecheck:suggestions

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package:vsix

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [24.18.1]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use pinned npm
        shell: bash
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check TypeScript suggestions
        run: npm run typecheck:suggestions

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package:vsix

  windows-vscode-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm

      - name: Use pinned npm
        shell: bash
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Run Windows VS Code sandbox smoke tests
        id: sandbox
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          VARRO_KEEP_VSCODE_SANDBOX: 1
        run: npm run test:vscode-sandbox -- clean-install-missing-cli invalid-cli-path healthy-first-run

      - name: Upload failed sandbox profiles
        if: failure() && steps.sandbox.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-vscode-sandbox-${{ github.run_id }}
          path: ${{ runner.temp }}/vr-*
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

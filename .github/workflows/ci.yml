name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24.20.0]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check TypeScript suggestions
        run: npm run typecheck:suggestions

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm run test:coverage

      - name: Test build scripts
        run: npm run test:scripts

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package:vsix

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24.20.0]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use pinned npm
        shell: bash
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check TypeScript suggestions
        run: npm run typecheck:suggestions

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package:vsix

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm")

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test browser scripts
        run: npm run test:scripts:browser

      - name: Run e2e tests
        run: npm run test:e2e
